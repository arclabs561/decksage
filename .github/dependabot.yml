version: 2
updates:
  - package-ecosystem: gomod
    directory: "/src/backend"
    schedule:
      interval: weekly
    groups:
      gomod-src-backend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
