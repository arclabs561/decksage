id: "0055"
date: "2026-03-24"
title: "HGT with contrastive (InfoNCE) loss on A10G GPU"
game: magic

hypothesis: >
  Contrastive loss (InfoNCE, tau=0.5) will produce similarity-preserving
  embeddings unlike link prediction (exp 0054). Directly optimizes for
  embedding similarity between co-occurring cards.

method:
  script: scripts/training/train_hgt.py
  args: "--game magic --loss contrastive --epochs 100 --heads 4 --layers 3 --dim 128 --batch-size 1024 --num-neighbors 10,10 --temperature 0.5"
  hardware: g5.2xlarge (A10G 24GB)
  training_time: "776.8s (13min)"

data:
  note: "same as experiment 0054 (0054_hgt_mini_batch.yaml)"
  edge_types: deck (1.5M), enriched (1.5M), set (2.2M), precon (283K), keyword (83K), oracle_text (497K)
  total_directed_edges: 12M
  nodes: 36,315
  card_annotations: 27,507/36,315 (76%)

results:
  training:
    final_loss: 1.7580
    loss_plateaued: "epoch ~20, no improvement through epoch 100"
    val_auc_epoch_100: 0.8026
  evaluation:
    hgt_contrastive_raw_sub_ndcg: 0.0018
    hgt_contrastive_fused_sub_ndcg: 0.0124
    hgt_link_pred_fused_sub_ndcg: 0.0140
    spectral_sub_ndcg: 0.1067
    note: "Contrastive WORSE than link prediction (0.012 vs 0.014)"

summary:
  title: "HGT contrastive (InfoNCE) on A10G"
  data: "same as 0054"
  metric: "sub nDCG"
  result: "0.002 raw, 0.012 fused (worse than link pred 0.014; loss plateaued epoch 20)"

conclusion: >
  InfoNCE contrastive loss on co-occurrence edges does not produce useful
  similarity embeddings. Loss plateaued early (1.758 from epoch 20-100).
  The co-occurrence signal is the same one PecanPy already captures better
  through random walks. The GNN architecture adds nothing when the objective
  is the same signal. Both link prediction and contrastive HGT are dead ends
  for this data. Future: try text-based contrastive (card oracle text pairs)
  or completely different approach (Residual2Vec, VERSE).

artifacts:
  - data/embeddings/magic_hgt_contrastive.wv
  - data/embeddings/magic_hgt_contrastive_fused.wv
