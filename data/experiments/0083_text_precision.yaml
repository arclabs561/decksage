id: "0083"
date: "2026-10-31"
title: "Precision of the text candidate pool on fresh judgments (magic)"
game: magic
status: "complete"

hypothesis: >
  0082 measured recall: text finds functional positives. It did not measure
  precision, and the Lightning Bolt example suggests E5 sometimes ranks names
  that share words ("Lightning Strike") above cards that share function. Fresh
  judgments of the text top-10 will show whether the pool is usable as-is or
  needs the functional re-ranker before the user sees it.

method:
  type: fresh_judgment_precision
  sampling: "12 test queries, all 10 E5 candidates each, excluding already-judged pairs"
  annotator: scripts/annotation/annotate_pairs_openrouter.py
  judges: [claude-sonnet-4-6, gpt-5.2, gemini-2.5-flash]
  metrics: >
    share of candidates with median functional_score >= 0.5 (precision@10),
    share >= 0.7, and the same for graph top-10 on existing labels
  commit: "751444e"
  threshold: >
    Text is usable without a re-ranker if precision@10 is at least the graph's.
    If it is below by more than 0.10, the re-ranker is required before display.

data:
  test_set: data/test_sets/annotated_magic_v2.json
  cache: data/cache/text_emb_cache_cards_magic_intfloat-e5-base-v2.npz
  batch: data-local/text-pool-20261031/review.json

results:
  queries: 12
  pairs: 112
  pairs_with_3_judges: 98
  text_precision_at_10_0p5: 0.3481
  text_precision_at_10_0p7: 0.1546
  graph_precision_judged_subset: 0.1286
  graph_judged_coverage: 1.0
  lexical_overlap_share: 0.1964
  score_with_lexical_overlap: 0.3666
  score_without_lexical_overlap: 0.3918
  verdict: "text_precision_better_but_modest"

conclusion: >
  Text is the better pool on precision as well as recall: 0.348 of its top-10
  are functional positives, against 0.129 for the graph's judged cabling on the
  same 12 queries. The absolute number is modest, so a re-ranker is still
  justified before display; the pool is right, the order is not yet.

  The lexical-bias worry did not reproduce: only 19.6% of candidates share a
  token with the query, and scores without lexical overlap (0.392) are slightly
  higher than with it (0.367). The Lightning Bolt name-match example was
  anecdotal. Caveat: 12 queries and 112 pairs, all LLM-labeled; precision is a
  sample, not a population estimate.

artifacts:
  - data/results/text_precision.json
