id: "0060"
date: "2026-03-26"
title: "Fusion-path substitute nDCG vs cosine baseline"
game: magic

hypothesis: >
  Routing substitute mode through WeightedLateFusion (task_type=substitution,
  which zeroes co-occurrence and uses text+functional signals) should produce
  better substitute rankings than raw cosine, since co-occurrence captures
  complement signal not substitution signal (functional AUC 0.317).

method:
  script: scripts/evaluation/eval_per_mode.py
  args: "--game magic --method fusion --quick"
  comparison: "--game magic --method cosine --quick"
  notes: >
    Fusion uses WeightedLateFusion with task_type=substitution weights
    (zeroes embed+jaccard, boosts text_embed+functional). Graph loaded
    from magic_unified.db (31,521 cards, 11.5M edges).

data:
  training:
    source: magic_v7_spectral_mu35.wv
    count: 25892
  evaluation:
    source: data/test_sets/annotated_magic_v2.json
    count: 3047 queries, 36307 annotations

results:
  cosine:
    substitute_ndcg: 0.525
    condensed_ndcg: 0.527
    convergence_gap: 0.002
    synergy_ndcg: 0.529
    meta_ndcg: 0.542
  fusion:
    substitute_ndcg: 0.031
    condensed_ndcg: 0.287
    convergence_gap: 0.256
    synergy_ndcg: 0.030
    meta_ndcg: 0.032
    notes: >
      Graph loaded correctly (31,521 cards). Fusion retrieves fundamentally
      different candidates than cosine. Most fusion candidates are unjudged
      in the test set (gap 0.256 vs 0.002 for cosine = massive coverage gap).

conclusion: >
  The fusion path is NOT validated by the current test set. The annotations
  were generated by evaluating cosine-ranked candidates. Fusion retrieves
  different cards that haven't been annotated, so nDCG collapses.

  This is NOT evidence that fusion is worse -- it's evidence that the test
  set is cosine-specific. To properly evaluate fusion, we need to:
  1. Fill top-K holes for fusion-path candidates (same process as v7 saturation)
  2. Re-evaluate after fusion-specific annotations are added
  3. Only then can we compare cosine vs fusion fairly

  DECISION: Revert substitute routing to cosine (was: fusion) until
  fusion-specific annotations exist. The routing change was correct in
  principle (co-occurrence is the wrong signal for substitution) but
  cannot be validated with the current evaluation infrastructure.

artifacts:
  - .claude/reports/scrutinize-2026-03-25.md
  - .claude/reports/next-steps-2026-03-26.md
