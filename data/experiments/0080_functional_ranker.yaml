id: "0080"
date: "2026-10-31"
title: "Supervised text/tag/co-occurrence ranker vs tag Jaccard (magic)"
game: magic
status: "pre-registered"

hypothesis: >
  The co-occurrence embedding orders substitutes poorly (within-query rho
  -0.04) and tag Jaccard orders them better (+0.20). A supervised model over
  text embeddings, tags and co-occurrence, trained on the refined pair labels,
  should combine the role signal with the card text and beat the tag prior on
  the same judged pools. If it does not, the labels or the features are the
  limit, not the model class.

method:
  type: supervised_pair_regression
  script: scripts/training/train_functional_ranker.py
  features:
    - e5_cosine (cached E5 document embeddings)
    - emb_cosine (magic_v7_spectral_mu35)
    - tag_jaccard (Scryfall Oracle Tags)
    - same_type, color_jaccard, mana_delta, text_jaccard
  model: HistGradientBoostingRegressor(300 iterations, lr 0.05, depth 6)
  validation: GroupKFold(5) by query; test-set queries removed from training
  evaluation: nDCG@10 on the judged candidates inside the v7 top-50
  baseline: tag:jaccard on the same pools
  commit: "see the commit that adds this note"
  threshold: >
    Support if the paired 95% CI for model-minus-tag is above zero. If it
    includes zero, record no_difference and inspect feature importances; if it
    is below zero, the supervised model is worse than the prior and the feature
    set is not usable.

data:
  train_pairs: data/annotations/refined/magic_pairs.json
  test_set: data/test_sets/annotated_magic_v2.json
  cache: data/cache/text_emb_cache_cards_magic_intfloat-e5-base-v2.npz
  cards: data/raw/scryfall/oracle-cards.json

results:
  status: "incomplete"
  reason: "pre-registered; run in the results commit"

conclusion: >
  Pending. This is the first direct test of whether a learned model trained on
  the pair labels beats a hand-built role prior on the same judged pools.

artifacts:
  - data/results/functional_ranker.json
