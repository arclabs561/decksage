id: "0062"
date: "2026-03-31"
title: "Text embeddings beat co-occurrence by 14-25% on substitute quality"
game: all

hypothesis: >
  E5 text embeddings should produce higher condensed substitute nDCG
  than co-occurrence embeddings on the expanded test set (which now
  includes text_e5 candidates alongside co-occurrence candidates).

method:
  script: scripts/evaluation/eval_per_mode.py
  args: "--all-games --compare text_e5 --quick"

data:
  evaluation:
    source: "annotated_{game}_v2.json (expanded with 2K text_e5 holes per game)"
    annotations:
      magic: 43307
      pokemon: 27376
      yugioh: 29106

results:
  cooccurrence_condensed_sub_ndcg:
    magic: 0.503
    pokemon: 0.414
    yugioh: 0.465
  text_e5_condensed_sub_ndcg:
    magic: 0.613
    pokemon: 0.518
    yugioh: 0.532
  improvement:
    magic: "+21.9%"
    pokemon: "+25.1%"
    yugioh: "+14.4%"
  text_e5_standard_sub_ndcg:
    magic: 0.151
    pokemon: 0.230
    yugioh: 0.276
  text_e5_convergence_gap:
    magic: 0.462
    pokemon: 0.288
    yugioh: 0.256

validity:
  status: invalid
  reason: "E5 was fine-tuned on annotated_*_v2.json, the evaluation set. The scores do not measure held-out quality and are not established upper bounds."
  detected: "2026-10-22"
  rule: "data/experiments/README.md#validity"

summary:
  title: "Text_e5 vs co-occurrence quality"
  data: "condensed sub nDCG"
  metric: "condensed nDCG"
  result: "**CONTAMINATED**: E5 trained on the eval set; held-out quality unknown"

conclusion: >
  Withdrawn: the evaluated E5 model was trained on evaluation annotations.
  These results cannot establish a held-out advantage or justify a production
  routing decision. Re-evaluate independent models on matched queries and a
  frozen, task-specific reference set.

artifacts:
  - /tmp/eval_compare.log
  - /tmp/eval_default.log
