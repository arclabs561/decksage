id: "0063"
date: "2026-03-31"
title: "Cross-encoder reranker training (3 iterations)"
game: all
hypothesis: >
  A cross-encoder fine-tuned on annotation pairs can learn TCG-specific
  pairwise similarity that bi-encoders miss (e.g., "destroy all monsters"
  is similar to "destroy all creatures"). Per-query nDCG should improve
  over raw cosine similarity.
method:
  script: scripts/training/train_cross_encoder.py
  args: "--all-games --epochs 5"
  notes: |
    Three iterations:
    - v1: MiniLM-L6, 256 tokens, 1 epoch, Magic only
    - v2: MiniLM-L6, 256 tokens, 5 epochs, all games, hard negatives + oversampling
    - v3: MiniLM-L12, 384 tokens, 5 epochs, query-level split, zero downsampling,
      symmetric pairs, rich text (name|type|cost|oracle_text)
data:
  training:
    source: data/test_sets/annotated_*_v2.json (EVAL DATA -- leakage documented)
    count: "~100K raw pairs -> 135K after symmetric+balance+negatives (v3)"
  notes: |
    WARNING: Training on eval annotations. Metrics are not held-out estimates.
    Query-level splitting alone does not establish independent evaluation.
results:
  status: incomplete
  reason: "v3 training was still at epoch 0.9 when recorded; final Pearson/Spearman/nDCG were never written."
  v1:
    pearson: 0.461
    spearman: 0.315
    training_time: "206s"
    notes: "Missing deps, evaluator API change"
  v2:
    pearson: 0.695
    spearman: 0.658
    training_time: "4036s (~67min)"
    notes: "Pair-level split inflates metrics (same card in train+val)"
  v3:
    pearson: "0.560 (epoch 0.9; final not recorded)"
    spearman: "0.475 (epoch 0.9; final not recorded)"
    ndcg: not recorded
    notes: "Query-level split; training was unfinished and final performance is unknown."
validity:
  status: invalid
  reason: "Cross-encoder trained on eval annotations. Pearson figures are not held-out estimates and the model is not served."
  detected: "2026-10-22"
  rule: "data/experiments/README.md#validity"

summary:
  title: "Cross-encoder reranker training"
  data: "100K annotation pairs"
  metric: "Pearson/nDCG"
  result: "v2: Pearson **0.695** (inflated), v3: **~0.56** at epoch 0.9"

conclusion: >
  Withdrawn: the training source overlaps the evaluation annotations and v3
  did not finish. The reported figures do not establish held-out performance
  or a fair comparison between the iterations.
artifacts:
  - data/models/cross_encoder_reranker/
  - scripts/training/train_cross_encoder.py
  - docs/failure_taxonomy.md
