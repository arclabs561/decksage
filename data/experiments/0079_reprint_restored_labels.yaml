id: "0079"
date: "2026-10-31"
title: "Reprint arms with the 31 missing/mislabelled pairs restored (magic)"
game: magic
status: "complete"

hypothesis: >
  Three independent judges scored all 31 blocked reprint pairs 1.0: 14 judged
  pairs had been labelled 0.0 and 17 were unjudged. If those labels were the
  remaining defect, restoring them should raise the reprint arm's nDCG above
  zero and widen its recall advantage; the boost should become positive on the
  covered queries instead of neutral.

method:
  type: fixed_candidate_set_comparison
  script: scripts/evaluation/compare_recommendations.py
  args: >
    --game magic --judged-only --candidate-sources reprint:exact
    --reprint-cards data/raw/scryfall/oracle-cards.json
    --label-patch data/patches/magic_reprint_labels_20261031.json
  secondary:
    script: scripts/evaluation/reprint_boost.py
    args: >
      --judged-only --label-patch data/patches/magic_reprint_labels_20261031.json
  baseline: magic_v7_spectral_mu35
  depth: 50
  metrics: "nDCG@10 and recall@10 on judged pools, paired bootstrap 1000 resamples, seed 13"
  task: substitute
  commit: "1ebd82d"
  threshold: >
    Genuine win if the nDCG CI is above zero and recall is not lower. Useful
    recall tool if the nDCG CI includes zero and recall improves by at least
    0.05. Harmful if the nDCG CI is below zero. The patch provenance is three
    unanimous judges; it is a label repair, not an independent arm.

data:
  test_set: data/test_sets/annotated_magic_v2.json
  patch: data/patches/magic_reprint_labels_20261031.json
  patch_pairs: 31
  patch_source: "claude-sonnet-4-6, gpt-5.2, gemini-2.5-flash; all 1.0, spread 0.0"

results:
  standalone:
    queries: 912
    baseline_ndcg_at_10: 0.5339
    candidate_ndcg_at_10: 0.5274
    delta: -0.0065
    delta_ci_95: [-0.0205, 0.0075]
    recall_delta: 0.0553
    verdict: "no_difference_recall_up"
  boost:
    queries: 2554
    reprint_covered: 35
    delta: 0.0033
    delta_ci_95: [0.0018, 0.0049]
    covered_delta: 0.2421
    recall_delta: 0.0028
    verdict: "candidate_better_where_covered"

conclusion: >
  Restoring the 31 pairs changes the family's verdict. The boost is now
  positive overall (+0.0033, CI [+0.0018, +0.0049]) and gains +0.2421 nDCG on
  the 35 queries where a reprint is in the pool; the standalone arm is a recall
  tool (-0.0065 nDCG, CI includes zero, +0.0553 recall). The earlier -0.37 and
  -0.0466 were coverage plus mislabels, not evidence about reprints.

  The boost fires on only 35 of 2,554 queries (1.4%), so this is a rare,
  high-precision promotion rather than a general re-ranker. The product
  question is now candidate generation: can the pool surface reprints for more
  queries? The 31-pair human batch remains a confirmation of the LLM repair,
  not a blocker.

artifacts:
  - data/results/reprint_judged_only_patched.json
