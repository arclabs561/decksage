id: "0087"
date: "2026-10-31"
title: "Shared text-encoder trunk with three heads vs per-facet encoders (magic)"
game: magic
status: "complete"
hypothesis: >
  0086 showed a shared trunk matches separate models on seven scalar features.
  Those features are already summaries: e5_cosine, graph cosine, tag Jaccard.
  If one encoder can serve functional, synergy and meta, it must work from the
  raw pair representation, not from seven hand-built scalars. Feed the two E5
  vectors (1536 dims) to (a) three separate per-facet MLPs and (b) one shared
  trunk with three heads. If shared matches separate on full vectors as well,
  the unified model is viable at the representation level and can replace the
  per-facet rankers. If a facet degrades, the facets need separate projections
  even when the trunk is shared.

method:
  type: architecture_comparison
  script: scripts/evaluation/encoder_trunk_probe.py
  input: "concatenated E5 vectors of query and candidate (2x768), L2-normalised"
  baselines:
    scalar_shared: "0086 feature set, shared trunk (reproduced on the same rows)"
    vector_separate: "three MLPRegressors on the 1536-d pair vector"
    vector_shared: "one MLPRegressor with three outputs on the same input"
  models: "MLPRegressor(hidden=(64,32)), early_stopping, random_state=13"
  amendments:
    - at: "2026-11-01"
      change: >
        Raw 1536-d MLPs were replaced by PCA(128) fitted inside each fold plus a
        64x32 MLP. The raw version ran over an hour at ~400% CPU without
        finishing; reduction is fit on training rows only, so no fold leaks.
      why: "Tractability; no change to the comparison or the threshold."
  validation: "GroupKFold(5) by query on identical rows for every arm"
  metrics: "per-target MAE and Spearman on out-of-fold predictions"
  threshold: >
    Vector-shared is viable if mean MAE is within +0.01 of vector-separate and
    no target degrades by more than 0.02. A facet that degrades by more than
    0.02 is negative transfer and forbids a single undifferentiated score. A
    vector arm that fails to beat scalar_shared means the E5 pair vector
    carries no information beyond its cosine, and the feature trunk stays.

data:
  test_set: data/test_sets/annotated_magic_v2.json
  cache: data/cache/text_emb_cache_cards_magic_intfloat-e5-base-v2.npz
  embedding: data/embeddings/magic_v7_spectral_mu35.wv
  tags: data-local/label-anchor-20261030/oracle-tags.jsonl.gz
  rows: 41056
  queries: 3046
  note: >
    Labels are LLM annotations with ~0.19 MAE against fresh judges. Any gap
    smaller than that is not interpretable as model quality.

results:
  rows: 40948
  queries: 3040
  arms:
    scalar_shared:
      functional: {mae: 0.1460, spearman: 0.2757}
      synergy: {mae: 0.1318, spearman: 0.2391}
      meta: {mae: 0.1315, spearman: 0.2615}
    scalar_separate:
      functional: {mae: 0.1470, spearman: 0.2753}
      synergy: {mae: 0.1324, spearman: 0.2274}
      meta: {mae: 0.1299, spearman: 0.2584}
    vector_shared:
      functional: {mae: 0.1835, spearman: 0.1242}
      synergy: {mae: 0.1458, spearman: 0.1182}
      meta: {mae: 0.1502, spearman: 0.1168}
    vector_separate:
      functional: {mae: 0.1872, spearman: 0.1189}
      synergy: {mae: 0.1568, spearman: 0.0997}
      meta: {mae: 0.1610, spearman: 0.0991}
  mean_mae:
    scalar_shared: 0.1364
    scalar_separate: 0.1364
    vector_shared: 0.1598
    vector_separate: 0.1683
  delta_shared_minus_separate: -0.0085
  per_target_delta:
    functional_score: -0.0037
    synergy_score: -0.0110
    meta_relevance: -0.0108
  vector_beats_scalar_shared: false
  verdict: "shared_matches_separate"
  artifact: data/results/encoder_trunk_0087.json

conclusion: >
  The shared trunk holds at the representation level: vector_shared beats
  vector_separate on mean MAE (0.1598 vs 0.1683, delta -0.0085) and on every
  target, so there is still no negative transfer when the shared layer sees
  raw pair vectors instead of seven scalars. That is the third independent
  check in the same direction (0086 features, 0087 vectors).

  The important negative is that the raw-vector arms are worse than the scalar
  arm (0.1598 vs 0.1364 mean MAE; Spearman 0.12 vs 0.27). Two readings, and
  the data cannot separate them: PCA-128 (the tractability amendment) may
  discard the informative directions, or the E5 pair vector simply carries
  less usable signal than the engineered scalars that the earlier feature set
  encodes (cosine, tag Jaccard, type/colour/mana deltas). Either way, the
  conclusion for the product is unchanged: keep the scalar feature trunk and
  do not replace it with raw embeddings on this evidence.

  This does not test fine-tuning a text encoder, only whether the frozen E5
  pair representation carries the facet signal. A real encoder sharing test
  needs task-head training through the encoder, which is a larger run than
  this probe.

  Caveat: labels are LLM judgments with ~0.19 MAE against fresh judges. The
  within-arm gaps (0.0085) are well inside that noise; the scalar-vs-vector gap
  (0.023) is not large either, so treat the direction as suggestive.
