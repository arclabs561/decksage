id: "0041"
date: "2026-03-21"
title: "Epoch sweep with annotation leakage fixed: reveals true baseline"
game: all

hypothesis: >
  After removing annotation edges from training (leakage fix), the true
  MetaPath2Vec performance on substitution tasks should be lower than
  previously reported. The epoch sweep will find the optimal training
  duration per game on clean (self-supervised only) data.

method:
  type: sweep
  script: scripts/training/sweep_epochs.sh
  args: "GAMES='pokemon yugioh magic' EPOCHS_LIST='5 10 20 40 80 160'"
  commit: ec6de56

data:
  training:
    source: "Self-supervised only: deck, enriched, set, precon, keyword, archetype, commander"
    description: "Annotation edges (annotation_edges.edg, diverse_annotation_edges.edg) EXCLUDED"
  evaluation:
    source: data/test_sets/annotated_*_v2.json
    description: "No overlap with training data"

results:
  pokemon_5ep: "sub 0.001 (was 0.242 with leakage)"
  pokemon_10ep: "sub 0.001"
  pokemon_20ep: "sub 0.003"
  pokemon_40ep: "sub 0.005"
  pokemon_80ep: pending
  pokemon_160ep: pending
  yugioh: pending
  magic: pending

  leakage_impact: >
    Removing 808 annotation edges (0.02% of training data) caused a catastrophic
    drop in sub nDCG for pokemon: 0.242 -> 0.001. This proves the previous
    MetaPath2Vec results were almost entirely driven by memorizing the eval set
    through the annotation edges in the training graph.

conclusion: >
  IN PROGRESS. Early results show that pure self-supervised MetaPath2Vec
  embeddings do not capture substitution relationships. Co-occurrence graphs
  encode complement (cards used together), not substitute (cards that replace
  each other). The previous "good" results were leakage artifacts.

  Path forward for substitution:
  1. Text embeddings (E5/BERT) -- card oracle text directly encodes function
  2. Contrastive learning with hard negatives mined from text similarity
  3. Hybrid: graph embeddings for synergy/completion, text for substitution
  4. The MetaPath2Vec embeddings are still valuable for synergy/deck completion
     tasks -- just not for substitution

artifacts:
  - data/logs/epoch_sweep_results.tsv
