id: "0041"
date: "2026-03-21"
title: "Epoch sweep (no leakage): MetaPath2Vec needs 80+ epochs to converge"
game: all
hypothesis: >
  After removing annotation edges from training (leakage fix), the true MetaPath2Vec performance on substitution tasks should be lower than previously reported. The epoch sweep will find the optimal training duration per game on clean (self-supervised only) data.

method:
  type: sweep
  script: scripts/training/sweep_epochs.sh
  args: "GAMES='pokemon yugioh' EPOCHS_LIST='5 10 20 40 80 160'"
  commit: ec6de56
data:
  training:
    source: "Self-supervised only: deck, enriched, set, precon, keyword, archetype, commander"
    description: "Annotation edges EXCLUDED (train/eval separation)"
    pokemon_cards: 4420
    pokemon_edges: "~497K (4 types: deck, enriched, annotation excluded, set)"
    yugioh_cards: 15439
    yugioh_edges: "~1.6M (4 types)"
  evaluation:
    source: data/test_sets/annotated_*_v2.json
results:
  pokemon:
    5ep: {sub: 0.001, ctx: 0.002, comp: 0.002, loss: 4.62}
    10ep: {sub: 0.001, ctx: 0.005, comp: 0.004, loss: 3.11}
    20ep: {sub: 0.003, ctx: 0.010, comp: 0.010, loss: 1.64}
    40ep: {sub: 0.005, ctx: 0.026, comp: 0.070, loss: 0.92}
    80ep: {sub: 0.049, ctx: 0.239, comp: 0.307, loss: 0.79}
    160ep: {sub: 0.096, ctx: 0.330, comp: 0.400, loss: 1.07}
  yugioh:
    5ep: {sub: 0.001, ctx: 0.002, comp: 0.004, loss: 2.85}
    10ep: {sub: 0.001, ctx: 0.006, comp: 0.025, loss: 1.34}
    20ep: {sub: 0.133, ctx: 0.374, comp: 0.587, loss: 0.89}
    40ep: {sub: 0.273, ctx: 0.684, comp: 0.776, loss: 0.83}
    80ep: {sub: 0.308, ctx: 0.740, comp: 0.800, loss: 0.82}
    160ep: {sub: 0.311, ctx: 0.745, comp: 0.802, loss: 0.81}
  leakage_impact: >
    Removing 808 annotation edges (0.02% of training data) caused 50-200x drops in sub nDCG. Previous results were almost entirely leakage artifacts.

  comparison_with_cleora:
    yugioh_mp2v_80ep: 0.308
    yugioh_cleora_3iter: 0.284
    note: "MetaPath2Vec 80ep beats Cleora for YuGiOh (+8%) but takes 42 min vs seconds"
conclusion: >
  COMPLETE. Without annotation leakage, MetaPath2Vec needs 80+ epochs to produce useful substitution embeddings. YuGiOh converges well (sub 0.308 at 80ep, beats Cleora 0.284) but takes 42 min. Pokemon converges poorly (sub 0.096 at 160ep, below Cleora 0.103 in seconds).

  Key findings: 1. Convergence is game-size dependent: YuGiOh (15K cards) converges at 40-80ep,

     Pokemon (4K cards) is still improving at 160ep but slowly
  2. Completion recall converges faster than substitution nDCG 3. For fast iteration, Cleora is the better choice (seconds vs minutes) 4. For final quality on large games, MetaPath2Vec 80ep is competitive

artifacts:
  - data/logs/epoch_sweep_results.tsv
  - data/logs/pokemon_metapath2vec_sweep_*_run.json
  - data/logs/yugioh_metapath2vec_sweep_*_run.json
