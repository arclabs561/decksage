id: "0057"
date: "2026-03-25"
title: "Multi-model cascade annotation pipeline"
game: all

hypothesis: >
  A cascade of cheap fast models (Groq 70B + Cerebras 235B) with isotonic
  calibration can replace the expensive 6-model IAA consensus at 10-40x
  lower cost while maintaining correlation > 0.6 with ground truth.

method:
  script: scripts/annotation/multi_model_annotate.py
  args: "calibrate --game magic --n-cal 50; then sentinel; then cascade vs IAA on 100 pairs"
  commit: "7f809d9"
  pipeline:
    tier1:
      - groq/llama-3.3-70b-versatile (2 samples, temp=0.5)
      - cerebras/qwen-3-235b-a22b-instruct-2507 (2 samples, temp=0.5)
    tier2: groq/qwen3-32b (for escalated pairs)
    aggregation: mean per dimension
    calibration: isotonic regression from 50 IAA ground truth pairs
    prompt: enriched_cascade_v1 (calibration anchors, scoring scale)

data:
  calibration:
    source: data/annotations/magic_2000_v4.json (6-judge IAA)
    count: 50 pairs (stratified by score)
  evaluation:
    source: same IAA, separate 100-pair stratified sample
  annotation_totals:
    magic: 14,535
    pokemon: 8,189
    yugioh: 8,512

results:
  calibration_per_game:
    magic:
      ensemble_corr: 0.636
      mae_raw: 0.036
      mae_calibrated: 0.015
      escalation_rate: 0.00
    pokemon:
      ensemble_corr: 0.617
      mae_raw: 0.060
      mae_calibrated: 0.035
      escalation_rate: 0.44
    yugioh:
      ensemble_corr: 0.452
      mae_raw: 0.103
      mae_calibrated: 0.085
      escalation_rate: 0.12

  cascade_vs_iaa_consensus:
    n_pairs: 100
    raw_corr: 0.565
    raw_mae: 0.038
    calibrated_corr: 0.639
    calibrated_mae: 0.023
    mean_pred_calibrated: 0.080
    mean_truth: 0.084

  sentinel_check:
    n_sentinels: 10
    mae: 0.073
    failures: 1/10
    status: PASS

  individual_model_corr:
    groq_llama_70b: 0.102  # weak individually
    cerebras_qwen_235b: 0.309
    ensemble: 0.636  # dramatically better together

  annotation_cleanup_impact:
    magic_ndcg_before: 0.1256
    magic_ndcg_after: 0.1528
    improvement: "+21.6%"
    removed: 3349 zero-score annotations from ollama/llama3.2

  bad_model_findings:
    groq_llama_8b: "corr=-0.076, useless for calibrated scoring"
    ollama_llama3.2: "54-97% zero scores with compact prompt"
    gpt_4.1_nano: "mean 0.717, systematic inflation"

  cost_comparison:
    openrouter_6model_iaa: "$2-15 per 1000 pairs"
    cascade_groq_cerebras: "$0.40 per 1000 pairs"
    groq_8b_single: "$0.024 per 1000 pairs (but corr=-0.076)"
    cost_reduction: "10-40x"

  ndcg_post_cleanup:
    magic: 0.1528
    pokemon: 0.1004
    yugioh: 0.1643

conclusion: >
  Hypothesis confirmed. The multi-model cascade achieves correlation 0.639
  with IAA consensus after isotonic calibration, at $0.40/1K pairs (vs $2-15).
  Key findings: (1) 8B models are useless for calibrated continuous scoring.
  (2) Ensemble of 70B + 235B dramatically beats individual models (0.636 vs
  0.102/0.309). (3) Removing bad annotations (zero-score from broken models)
  had the biggest single impact on nDCG (+21.6% for magic). (4) Data quality
  trumps data quantity -- again.

artifacts:
  - data/calibration/magic_calibration.json
  - data/calibration/pokemon_calibration.json
  - data/calibration/yugioh_calibration.json
  - data/calibration/magic_sentinels.json
  - scripts/annotation/multi_model_annotate.py
  - scripts/annotation/repair_annotations.py
  - scripts/annotation/bench_local_llm.py
  - .claude/reports/research-multi-model-annotation-2026-03-25.md
