id: "0075"
date: "2026-10-31"
title: "Exact-reprint promotion inside the embedding's top-50 (magic)"
game: magic
status: "complete"

hypothesis: >
  0074 showed that replacing the embedding ranking with an exact-reprint arm
  destroys nDCG, because most queries have no reprint and the arm zeroes every
  other candidate. The remaining question is narrower: when an exact functional
  reprint is already inside the embedding's top-50, does promoting it to the
  front of the top-10 improve nDCG@10 without hurting queries that have no
  reprint? Because the rule never removes a candidate and never fires without a
  reprint in the pool, it should be weakly positive overall and clearly positive
  on the reprint-covered subset.

method:
  type: fixed_candidate_set_comparison
  script: scripts/evaluation/reprint_boost.py
  args: >
    --test-set data/test_sets/annotated_magic_v2.json
    --embedding data/embeddings/magic_v7_spectral_mu35.wv
    --cards data/raw/scryfall/oracle-cards.json
  baseline: magic_v7_spectral_mu35
  depth: 50
  metrics: "nDCG@10, paired bootstrap over queries, 1000 resamples, seed 13"
  task: substitute
  commit: "a6afa07"
  threshold: >
    Support only if the paired 95% CI for the nDCG@10 delta is above zero on
    the reprint-covered queries and the overall delta is not negative. If the
    covered delta is positive but the CI crosses zero, record insufficient
    support at this sample size rather than a win.

data:
  test_set:
    path: data/test_sets/annotated_magic_v2.json
    queries: 3047
  cards: data/raw/scryfall/oracle-cards.json
  grouping: "normalized oracle_text + type_line, text non-empty and >=10 chars"
  candidate_pool: "embedding most_similar top-50 per query"

results:
  queries: 2556
  reprint_covered: 35
  baseline_ndcg_at_10: 0.4978
  boosted_ndcg_at_10: 0.4972
  delta: -0.0006
  delta_ci_95: [-0.0011, -0.0002]
  covered_baseline_ndcg_at_10: 0.6083
  covered_boosted_ndcg_at_10: 0.5617
  covered_delta: -0.0466
  original_verdict: "candidate_worse"
  verdict: "inconclusive_measurement"
  measurement_caveat: >
    Of 43 reprint instances in the 35 covered queries, 17 are unjudged and therefore scored 0 (their baseline ranks are 11-46). Of the 26 judged instances, four identical reprints are labelled 0.0 and others 0.86-1.0. A 35-query subset with this label noise cannot decide the rule; the negative is a measurement artifact, not evidence about reprints.

conclusion: >
  The hypothesis is not supported even in the weak, never-removes-a-candidate
  form. Promotion is slightly negative overall (0.4972 vs 0.4978, CI
  [-0.0011, -0.0002]) and clearly negative on the 35 reprint-covered queries
  (0.5617 vs 0.6083, delta -0.0466). Only 35 of 2556 queries have an exact
  reprint inside the embedding's top-50, so the arm is also too rare to matter;
  and where it fires, the judges do not rank the reprint above the embedding's
  picks. Together with 0073 and 0074 this closes the hand-built reprint line:
  exact oracle-text identity is not a substitute for the judged functional
  relation. Next signal must be human pair judgments or a learned text
  re-ranker, not another reprint rule.

amendment:
  date: "2026-10-31"
  reason: >
    Annotation coverage makes the original verdict uninterpretable. The Magic
    test set annotates a median of 11 candidates per query while the fixed
    candidate pool is the embedding top-50, and nDCG counts unjudged candidates
    as 0. Any arm that promotes an unjudged card is penalised by construction.
    Full diagnosis: .agents/reports/2026-10-31-negative-results-postmortem.md.
  revised_verdict: "measurement_artifact"
  original_verdict: "candidate_worse"
  retest: >
    0077 judged-only: delta 0.0000 (CI [-0.0003, 0.0003]) on 2,554 queries and
    +0.0030 on the 22 covered queries, recall unchanged. The covered -0.0466
    was entirely the unjudged penalty. The rule is neutral and too rare to
    matter; annotate the reprint queue before judging it again.

artifacts:
  - scripts/evaluation/reprint_boost.py
