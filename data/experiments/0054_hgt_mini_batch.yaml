id: "0054"
date: "2026-03-23"
title: "HGT with NeighborLoader mini-batching on A10G GPU"
game: magic

hypothesis: >
  HGT with NeighborLoader will fit on A10G 24GB and learn per-edge-type
  attention weights that improve over PecanPy's uniform random walks.

method:
  script: scripts/training/train_hgt.py
  args: "--game magic --epochs 50 --heads 4 --layers 3 --dim 128 --batch-size 1024 --num-neighbors 10,10"
  hardware: g5.2xlarge (A10G 24GB)
  deps: "torch 2.7.1+cu126, torch-geometric, torch-sparse, pyg-lib"
  training_time: "1015s (17min)"

data:
  edge_types: deck (1.5M), enriched (1.5M), set (2.2M), precon (283K), keyword (83K), oracle_text (497K)
  total_directed_edges: 12M
  nodes: 36,315
  card_annotations: 27,507/36,315 (76%)

results:
  training:
    final_loss: 0.4416
    val_auc_epoch_50: 0.8022
    val_auc_best: 0.8043 (epoch 45)
    gpu_memory: 17GB peak
  evaluation:
    hgt_raw_sub_ndcg: 0.0028
    hgt_fused_sub_ndcg: 0.0140
    v7_fused_sub_ndcg: 0.1019
    note: "HGT embeddings are near-random for similarity despite good link prediction AUC"

conclusion: >
  NeighborLoader mini-batching solved the OOM issue (17GB/24GB). The model trains
  and achieves reasonable link prediction AUC (0.80). However, the node embeddings
  are not useful for card similarity (sub nDCG 0.003 raw). The link prediction
  objective optimizes for edge existence, not for producing similarity-preserving
  embeddings. Next: try contrastive loss or deeper training (200+ epochs),
  or use the HGT as a feature extractor with downstream similarity fine-tuning.

artifacts:
  - data/embeddings/magic_hgt.wv
  - data/embeddings/magic_hgt_fused.wv
  - data/logs/magic_hgt_loss.csv (on GPU instance)
