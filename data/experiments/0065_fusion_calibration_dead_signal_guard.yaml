id: "0065"
date: "2026-10-22"
title: "Fusion weight calibration on v2 labels with dead-signal guard"
game: magic
hypothesis: >
  With three of five signals unavailable in this script, calibrating the
  remaining ones should still beat the unweighted default, and the fit should
  not overstate what fusion can do when functional and visual inputs are
  missing.
method:
  script: scripts/training/calibrate_fusion_weights.py
  args: "--game magic --quick"
  notes: |
    27-combination quick grid over the signals that survive the new
    availability check: embed, jaccard, text_embed. functional is excluded
    because this script never constructs a tagger; visual_embed because no
    visual index exists on disk. Fitness on an 80% query split, reported on
    the held-out 20%, seed 13.
data:
  training:
    source: "data/test_sets/annotated_magic_v2.json, 80% query split"
    count: 2437
  evaluation:
    source: "same file, seed-13 20% holdout"
    count: 610
  fingerprint:
    embedding: magic_v7_spectral_mu35
    cards: 25892
    graph: pairs_magic_archidekt_commander.csv
    text_index_cards: 36453
    annotations: 43307
results:
  status: measured
  ndcg_at_10_holdout: 0.5923
  ndcg_at_10_fit: 0.5743
  best_weights:
    embed: 0.25
    jaccard: 0.0
    functional: 0.0
    text_embed: 0.0
    visual_embed: 0.0
  grid_size: 27
  signals_used: ["embed", "jaccard", "text_embed"]
  signals_excluded:
    functional: "no tagger is constructed in this script"
    visual_embed: "visual index missing or all-zero"
  elapsed_seconds: 3731
validity:
  status: invalid
  reason: >
    The calibration objective computed the ideal ranking from retrieved items
    only and counted unjudged results as zero, contrary to the canonical
    condensed nDCG definition. The selected weights and holdout score do not
    establish the claimed comparison; rerun with the corrected objective.
conclusion: >
  Withdrawn: the objective differs from canonical condensed nDCG and does not
  penalize missing higher-relevance candidates in its ideal ranking. Functional
  and visual inputs were also unavailable during the run.
artifacts:
  - data/embeddings/fusion_weights_magic.json
summary:
  title: "Fusion calibration, dead-signal guarded"
  data: "v2 labels, seed-13 80/20 split; 3 of 5 signals live"
  metric: "holdout nDCG@10"
  result: "Withdrawn: invalid calibration objective"
