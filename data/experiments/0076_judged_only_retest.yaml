id: "0076"
date: "2026-10-31"
title: "Judged-only re-test of the tag and reprint arms (magic)"
game: magic
status: "complete"

hypothesis: >
  The negative verdicts for 0072 and 0074 are confounded by annotation
  coverage: the fixed pool is the embedding top-50 but only a median of 11-13
  candidates per query are judged, and nDCG counts unjudged cards as 0. If the
  arm's loss is mostly that artifact, restricting both arms to judged candidates
  should move the delta toward zero. If the tag prior is genuinely insufficient
  (0071: rho 0.20), the tag delta stays clearly negative even on judged pools.
  For reprints, judged-only may leave too few queries to decide anything; that
  outcome is recorded as insufficient evidence, not as support.

method:
  type: fixed_candidate_set_comparison
  script: scripts/evaluation/compare_recommendations.py
  args: >
    --game magic --judged-only
    --candidate-sources tag:jaccard
    --tag-data data-local/label-anchor-20261030/oracle-tags.jsonl.gz
    --tag-cards data/raw/scryfall/oracle-cards.json
  secondary:
    args: >
      --game magic --judged-only --candidate-sources reprint:exact
      --reprint-cards data/raw/scryfall/oracle-cards.json
  baseline: magic_v7_spectral_mu35
  depth: 50
  metrics: "nDCG@10 and recall@10 over judged candidates only, paired bootstrap 1000 resamples, seed 13"
  task: substitute
  commit: "a402827"
  threshold: >
    Coverage artifact is sufficient if the tag judged-only 95% CI includes zero
    or the mean delta is above -0.05 (less than a third of the original -0.18).
    The tag prior is genuinely worse if the CI is below zero and the mean is at
    or below -0.10. Between those, record inconclusive. Reprint judges-only is
    expected to fall below the 30-query floor; report the count and stop.

data:
  test_set:
    path: data/test_sets/annotated_magic_v2.json
    queries: 3047
  judged_coverage: "median 11 per query in the full pool; judged-only pool reported per query"
  tags: data-local/label-anchor-20261030/oracle-tags.jsonl.gz
  cards: data/raw/scryfall/oracle-cards.json

results:
  tag:
    queries: 1124
    baseline_ndcg_at_10: 0.5217
    candidate_ndcg_at_10: 0.6004
    delta: 0.0787
    delta_ci_95: [0.0684, 0.0905]
    recall_delta: 0.0768
    win_rate: 0.66
    delta_when_pool_le_10: 0.048
    delta_when_pool_11_25: 0.119
    verdict: "candidate_better"
  reprint:
    queries: 906
    baseline_ndcg_at_10: 0.5349
    candidate_ndcg_at_10: 0.5210
    delta: -0.0140
    delta_ci_95: [-0.0266, -0.0000]
    recall_delta: 0.0503
    verdict: "mixed_nDCG_down_recall_up"

conclusion: >
  The coverage-artifact explanation is rejected for tags and confirmed for
  reprints. On judged pools the tag arm is 0.0787 nDCG better (CI
  [+0.0684, +0.0905], 66% of queries win) and positive in every pool-size
  stratum, so the 0072 loss of -0.18 was the unjudged-candidate penalty, not a
  weak tag prior. Tags are a usable re-ranker inside the embedding's top-10,
  though this says nothing about tag-based candidate generation.

  The reprint arm moves the other way: nDCG -0.0140 (CI [-0.0266, -0.0000]) but
  recall +0.0503. Reprints are relevant often enough to raise recall, yet
  placing them first displaces more relevant cards. That is consistent with the
  label defect: 14 judged reprint instances with identical normalized oracle
  text are labelled 0.0 in this test set. Fix the reprint labels before treating
  the -0.014 as a property of reprints.

artifacts:
  - .agents/reports/2026-10-31-negative-results-postmortem.md
