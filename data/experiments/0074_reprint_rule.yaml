id: "0074"
date: "2026-10-30"
title: "Exact functional reprints as a fixed-candidate-set arm (magic)"
game: magic
status: "complete"

hypothesis: >
  Exact functional reprints (identical normalized oracle text and type, different
  name) are the strongest possible substitutes. If a reprint is present in the
  embedding's fixed candidate set, a deterministic reprint arm should rank it
  first and improve nDCG@10 over the embedding baseline on the queries where a
  reprint is retrievable. If it does not, the 33% top-10 known-item recall is a
  coverage failure, not a ranking failure, and the rule belongs in candidate
  generation rather than re-scoring.

method:
  type: fixed_candidate_set_comparison
  script: scripts/evaluation/compare_recommendations.py
  args: >
    --game magic --candidate-sources reprint:exact
    --reprint-cards data/raw/scryfall/oracle-cards.json
  baseline: magic_v7_spectral_mu35
  depth: 50
  metrics: "nDCG@10 and recall@10, paired bootstrap 1000 resamples, seed 13"
  task: substitute
  commit: "991501a"
  threshold: >
    Support only if the paired 95% CI for the nDCG@10 delta is above zero on the
    reprint-covered queries; otherwise record a negative.

data:
  test_set:
    path: data/test_sets/annotated_magic_v2.json
    queries: 3047
  groups: 483
  pairs: 843
  cards_in_groups: 1100
  source: data/raw/scryfall/oracle-cards.json
  grouping: "normalized oracle_text + type_line, text non-empty and >=10 chars"

results:
  usable_queries: 1282
  scored_queries: 441
  baseline_ndcg_at_10: 0.5002
  reprint_ndcg_at_10: 0.1266
  delta: -0.3736
  delta_ci_95: [-0.3989, -0.3487]
  baseline_recall_at_10: 0.6567
  reprint_recall_at_10: 0.1853
  recall_delta: -0.4714
  original_verdict: "candidate_worse"
  verdict: "inconclusive_measurement"
  measurement_caveat: >
    The candidate pool is the embedding top-50 but only a median of 13 candidates per query are judged; delta is -0.212 where >=20 are judged and -0.490 where <20 (Spearman +0.47). Four identical reprints in the judged set are also labelled 0.0, so the strongest positives are partly mislabelled. The arm is unmeasured on this label set.

conclusion: >
  The hypothesis is not supported as a standalone re-ranker: the reprint arm
  scores 0.1266 against the embedding's 0.5002 on 441 shared queries (delta
  -0.3736, CI [-0.3989, -0.3487]). The pre-registered alternative is the
  correct reading: exact reprints are a candidate-generation/coverage problem,
  not a re-ranking problem. A reprint arm that zeroes every non-reprint
  candidate cannot rank a normal query. Next: test a boost rule (keep the
  embedding score, promote exact reprints when present) before any product
  wiring; do not replace the embedding with this arm.

amendment:
  date: "2026-10-31"
  reason: >
    Annotation coverage makes the original verdict uninterpretable. The Magic
    test set annotates a median of 11 candidates per query while the fixed
    candidate pool is the embedding top-50, and nDCG counts unjudged candidates
    as 0. Any arm that promotes an unjudged card is penalised by construction.
    Full diagnosis: .agents/reports/2026-10-31-negative-results-postmortem.md.
  revised_verdict: "inconclusive_measurement"
  original_verdict: "candidate_worse"

artifacts:
  - data/results/functional_reprint_probe_20261030.json
