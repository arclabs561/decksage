id: "0047"
date: "2026-03-22"
title: "v6 blended: PecanPy + oracle text similarity + game-specific edges"
game: all

hypothesis: >
  Adding oracle text similarity edges (TF-IDF cosine > 0.3) to the
  PecanPy+Word2Vec pipeline will improve sub nDCG beyond v5_fused
  baselines. Oracle text captures functional similarity that co-occurrence
  misses. ns_exponent=-0.5 retained from v5.

method:
  type: embedding
  script: scripts/training/train_blended_embeddings.py
  args_pokemon: "--edgelist pokemon_merged_all (x1) + oracle_text (x5) + set (x3) --ns-exponent -0.5"
  args_yugioh: "--edgelist yugioh_merged_all (x1) + oracle_text (x5) + archetype (x3) --ns-exponent -0.5"
  args_magic: "not recorded (oracle text edges were still generating)"

data:
  pokemon:
    edges: "merged_all 180K + oracle_text 66K + set 137K"
  yugioh:
    edges: "merged_all 744K + oracle_text 186K + archetype 112K"
  magic:
    edges: "merged_all 331K + oracle_text (generating) + enriched 1.46M"

results:
  status: incomplete
  reason: "Blend runs produced embeddings (data/embeddings/*_v6_blended.wv) but sub nDCG was never recorded; Magic oracle-text edges were still generating."
  pokemon_sub_ndcg: not recorded
  yugioh_sub_ndcg: not recorded
  magic_sub_ndcg: not recorded
  comparison:
    v5_fused_magic: 0.099
    v5_fused_pokemon: 0.075
    v5_fused_yugioh: 0.157

summary:
  title: "v6 blended: PecanPy + oracle text edges"
  data: "merged + oracle_text + game edges"
  metric: "sub nDCG"
  result: "no blend nDCG measured"

conclusion: >
  NOT CONCLUDED. No blend sub nDCG was ever measured or recorded, so the
  oracle-text-edge hypothesis is untested. Only the v5_fused comparison
  baselines above are measured values. See results.reason.
