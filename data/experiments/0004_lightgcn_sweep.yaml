id: "0004"
date: "2026-03-19"
title: "LightGCN hyperparameter sweep (Magic)"
game: magic

hypothesis: >
  LightGCN (pure neighborhood aggregation, no feature transforms) with
  reconstruction loss should outperform PecanPy random walks for co-occurrence
  embedding, especially with tuned hyperparameters. The graph is dense
  (331K undirected edges) so BPR's random-negative assumption breaks down;
  weighted MSE reconstruction should work better.

method:
  type: sweep
  script: scripts/training/sweep_lightgcn.py
  args: "--game magic --quick --epochs 80 --patience 8"
  commit: 571bf60
  model: LightGCN (He et al., SIGIR 2020)
  details: >
    Grid search over 16 configs: dim=[64,128], layers=[2,3],
    lr=[1e-3,5e-4], l2_reg=[1e-4,1e-3]. Reconstruction loss (weighted MSE).
    Early stopping with patience=8. Evaluated with per-mode nDCG on
    annotated_magic_v2.json test set.

data:
  training:
    source: data/graphs/magic_merged_all.edg
    description: "Enriched edgelist, 15,697 nodes, 331,264 undirected edges"
    count: 331264
    split: "90/10 train/val (undirected edge split)"
  eval:
    source: data/test_sets/annotated_magic_v2.json
    description: "500 queries, 3,290 annotations with mode labels"

results:
  best_config:
    dim: 128
    layers: 2
    lr: 0.0005
    l2_reg: 0.0001
  best:
    overall_ndcg: 0.5455
    sub_ndcg: 0.5514
    syn_ndcg: 0.5491
    meta_ndcg: 0.5435
    random_mean_sim: 0.0009
    train_time_s: 270.0
    vocab: 15697
  comparison_v5_fused:
    overall_ndcg: 0.156
    improvement: "3.5x"
  all_configs: data/experiments/lightgcn_sweep_magic.tsv

canonical_eval:
  magic:
    overall_ndcg: 0.095
    sub_ndcg: 0.078
    syn_ndcg: 0.072
    meta_ndcg: 0.077
    sub_score_ndcg: 0.053
  comparison_v5_fused_canonical:
    overall_ndcg: 0.154
    sub_ndcg: 0.147
  pokemon:
    overall_ndcg: 0.030
    sub_ndcg: 0.023
  comparison_pokemon_v5_fused:
    overall_ndcg: 0.259

conclusion: >
  SWEEP EVAL WAS INFLATED. The inline sweep evaluator ranked within the
  annotation candidate set (biased), while canonical eval_per_mode.py checks
  if annotated cards appear in the embedding's top-10 (absolute recall).
  Canonical results: LightGCN 0.095 vs v5 fused 0.154 -- LightGCN is WORSE.

  Root cause: (1) smaller vocab (15,697 vs 21,151 for Magic) means LightGCN
  misses cards not in the edgelist, (2) annotations were created from v5 fused
  neighbors so ground truth is biased toward what v5 retrieves, (3) LightGCN
  learns dense graph structure but the test set measures semantic relevance.

  Lesson: always verify with canonical eval before reporting. Inline sweep
  eval is useful for relative config comparison but absolute numbers are
  meaningless. Updated CLAUDE.md eval rules accordingly.

artifacts:
  - data/embeddings/magic_lightgcn_best.wv
  - data/experiments/lightgcn_sweep_magic.tsv
