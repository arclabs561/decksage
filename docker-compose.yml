services:
  api:
    build: .
    container_name: decksage-api
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      - MEILISEARCH_URL=http://meilisearch:7700
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
      - TERM=xterm-256color
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./frontend:/app/frontend:ro
      # 6 MB curated tag bulk: the topology check needs its mtime, and tag
      # staleness cannot be judged without it.
      - ./data-local/label-anchor-20261030:/app/data-local/label-anchor-20261030:ro
    depends_on:
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    tty: true
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - decksage

  meilisearch:
    image: getmeili/meilisearch:v1.30.0
    container_name: decksage-meilisearch
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-}
      - MEILI_ENV=${ENVIRONMENT:-development}
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - decksage

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: decksage-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships neither curl nor wget; probe the REST port with bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - decksage

  # Data-plane refresh, owned by Compose (no host launch agents).
  # One-shot:  docker compose --profile refresh run --rm refresh
  # Recurring: docker compose --profile schedule up -d scheduler
  refresh:
    build: .
    container_name: decksage-refresh
    profiles: ["refresh"]
    command: ["sh", "/app/scripts/ops/refresh_container.sh"]
    healthcheck:
      disable: true
    environment:
      - MEILISEARCH_URL=http://meilisearch:7700
      - QDRANT_URL=http://qdrant:6333
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      # Writable: this service exists to write processed artifacts and graphs.
      - ./data:/app/data
      - ./data/cache:/app/data/cache
      # Curated Magic tag bulk (5.8 MB); data-local as a whole is 8.5 GB.
      - ./data-local/label-anchor-20261030:/app/data-local/label-anchor-20261030:ro
      - ${HF_CACHE:-./data-local/hf-hub}:/root/.cache/huggingface/hub:ro
    depends_on:
      api:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - decksage

  scheduler:
    build: .
    container_name: decksage-scheduler
    profiles: ["schedule"]
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while :; do
          sh /app/scripts/ops/refresh_container.sh || echo "refresh failed; retrying next interval" >&2
          sleep "$${REFRESH_INTERVAL:-86400}"
        done
    healthcheck:
      disable: true
    environment:
      - MEILISEARCH_URL=http://meilisearch:7700
      - QDRANT_URL=http://qdrant:6333
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-86400}
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
      - ./data/cache:/app/data/cache
      - ./data-local/label-anchor-20261030:/app/data-local/label-anchor-20261030:ro
      - ${HF_CACHE:-./data-local/hf-hub}:/root/.cache/huggingface/hub:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - decksage

volumes:
  meilisearch_data:
  qdrant_data:

networks:
  decksage:
