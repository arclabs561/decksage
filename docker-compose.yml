services:
  api:
    build: .
    container_name: decksage-api
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      - MEILISEARCH_URL=http://meilisearch:7700
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
      - TERM=xterm-256color
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./frontend:/app/frontend:ro
    depends_on:
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    tty: true
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - decksage

  meilisearch:
    image: getmeili/meilisearch:v1.30.0
    container_name: decksage-meilisearch
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-}
      - MEILI_ENV=${ENVIRONMENT:-development}
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - decksage

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: decksage-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships neither curl nor wget; probe the REST port with bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - decksage

volumes:
  meilisearch_data:
  qdrant_data:

networks:
  decksage:
