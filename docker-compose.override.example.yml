# Example override file for local development
# Copy to docker-compose.override.yml and customize paths
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # Edit paths as needed
#   docker compose up

services:
  api:
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS=*
      # Multi-game mode (all 3 games loaded)
      - DECKSAGE_GAMES=magic,pokemon,yugioh
      - DECKSAGE_DEFAULT_GAME=magic
      # Per-game embedding paths (inside container, mapped from host via volumes)
      - EMBEDDINGS_PATH_MAGIC=/app/data/embeddings/magic_128d_pecanpy.wv
      - EMBEDDINGS_PATH_POKEMON=/app/data/embeddings/pokemon_128d_pecanpy.wv
      - EMBEDDINGS_PATH_YUGIOH=/app/data/embeddings/yugioh_128d_pecanpy.wv
    volumes:
      # Mount data directories read-only
      - ./data/embeddings:/app/data/embeddings:ro
      - ./data/graphs:/app/data/graphs:ro
      - ./data/processed:/app/data/processed:ro
      - ./data/enriched:/app/data/enriched:ro
      # Frontend hot-reload
      - ./frontend:/app/frontend:ro
    # Hot-reload for API code changes
    command: ["uvicorn", "src.ml.api.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
