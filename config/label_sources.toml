# Label source registry
#
# One entry per external source that could produce labels. This file is the
# policy record: a source may only be used for the labels and access listed
# here, and only at or below its verdict. See docs/LABEL-SOURCES.md.
#
# verdict: adopt  - permissive enough to use now, with attribution
#          trial  - needs a licence, a sample audit, or both
#          reject - not usable for this project
# terms:   permissive | attribution | licence-required | prohibited | unknown

[[source]]
id = "commander-spellbook"
labels = ["synergy"]
access = "rest"
terms = "attribution"
verdict = "adopt"
note = "Explicit combo relations. Public API, 80 rpm, credit requested."

